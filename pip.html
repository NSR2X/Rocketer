<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocketer - Picture in Picture</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }

        .pip-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            z-index: 10;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            background: rgba(0,0,0,0.7);
            padding: 10px 15px;
            border-radius: 25px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 20;
        }

        .pip-container:hover .controls {
            opacity: 1;
        }

        .control-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.2s;
            backdrop-filter: blur(10px);
        }

        .control-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .launch-info {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 20;
            backdrop-filter: blur(10px);
        }

        .pip-container:hover .launch-info {
            opacity: 1;
        }

        .launch-title {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .launch-status {
            font-size: 12px;
            opacity: 0.8;
        }

        .error-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            z-index: 10;
            max-width: 300px;
        }

        .error-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .retry-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 16px;
            font-size: 14px;
        }

        .resize-handle {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 20px;
            height: 20px;
            background: linear-gradient(-45deg, transparent 40%, rgba(255,255,255,0.3) 50%, transparent 60%);
            cursor: se-resize;
            z-index: 30;
        }

        .minimized {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 320px;
            height: 180px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 1000;
            transition: all 0.3s ease;
        }

        .minimized:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="pip-container" id="pipContainer">
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Loading stream...</p>
        </div>

        <div class="launch-info" id="launchInfo" style="display: none;">
            <div class="launch-title" id="launchTitle">Rocket Launch Stream</div>
            <div class="launch-status" id="launchStatus">Live</div>
        </div>

        <div class="video-wrapper" id="videoWrapper" style="display: none;">
            <!-- Video iframe will be inserted here -->
        </div>

        <div class="error-message" id="errorMessage" style="display: none;">
            <div class="error-icon">⚠️</div>
            <h3>Stream Unavailable</h3>
            <p>The live stream is currently unavailable or has not started yet.</p>
            <button class="retry-btn" onclick="window.close()">Close</button>
        </div>

        <div class="controls" id="controls">
            <button class="control-btn" onclick="toggleFullscreen()" title="Toggle Fullscreen">⛶</button>
            <button class="control-btn" onclick="toggleMinimize()" title="Minimize">−</button>
            <button class="control-btn" onclick="openInNewTab()" title="Open in New Tab">↗</button>
            <button class="control-btn" onclick="showStreamSources()" title="Stream Sources" id="sourcesBtn" style="display: none;">📺</button>
            <button class="control-btn" onclick="window.close()" title="Close">✕</button>
        </div>

        <div class="resize-handle" id="resizeHandle"></div>
    </div>

    <script>
        let streamUrl = '';
        let launchName = '';
        let isMinimized = false;
        let streamInfo = null;

        // Listen for initialization message
        chrome.runtime.onMessage.addListener((message, sender, sendResponse) => {
            if (message.action === 'initPiP') {
                streamUrl = message.streamUrl;
                launchName = message.launchName;
                streamInfo = message.streamInfo || null;
                initializePiP();
            }
        });

        function initializePiP() {
            document.getElementById('launchTitle').textContent = launchName || 'Rocket Launch Stream';
            
            // Display stream source information
            if (streamInfo) {
                updateStreamInfo();
            }
            
            if (streamUrl) {
                loadStream();
            } else {
                showError();
            }
        }

        function updateStreamInfo() {
            const statusElement = document.getElementById('launchStatus');
            if (streamInfo) {
                const platformIcon = getPlatformIcon(streamInfo.platform);
                const platformName = formatPlatformName(streamInfo.platform);
                statusElement.innerHTML = `${platformIcon} ${platformName} • Live`;
                
                // Add stream quality indicator if available
                if (streamInfo.quality) {
                    statusElement.innerHTML += ` • ${streamInfo.quality}`;
                }
            }
        }

        function getPlatformIcon(platform) {
            const icons = {
                youtube: '📹',
                twitch: '🎮',
                spacex: '🚀',
                nasa: '🌌',
                facebook: '📘',
                twitter: '🐦',
                official: '🏢',
                other: '📺'
            };
            return icons[platform] || icons.other;
        }

        function formatPlatformName(platform) {
            const names = {
                youtube: 'YouTube',
                twitch: 'Twitch',
                spacex: 'SpaceX',
                nasa: 'NASA',
                facebook: 'Facebook',
                twitter: 'Twitter/X',
                official: 'Official',
                other: 'Stream'
            };
            return names[platform] || 'Stream';
        }

        function loadStream() {
            const videoWrapper = document.getElementById('videoWrapper');
            const loading = document.getElementById('loading');
            const launchInfo = document.getElementById('launchInfo');

            try {
                let embedUrl = convertToEmbedUrl(streamUrl);
                
                if (embedUrl) {
                    const iframe = document.createElement('iframe');
                    iframe.src = embedUrl;
                    iframe.allowFullscreen = true;
                    iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
                    
                    iframe.onload = () => {
                        loading.style.display = 'none';
                        videoWrapper.style.display = 'block';
                        launchInfo.style.display = 'block';
                    };
                    
                    iframe.onerror = () => {
                        showError();
                    };
                    
                    videoWrapper.appendChild(iframe);
                } else {
                    showError();
                }
            } catch (error) {
                console.error('Error loading stream:', error);
                showError();
            }
        }

        function convertToEmbedUrl(url) {
            // YouTube
            if (url.includes('youtube.com/watch')) {
                const videoId = url.split('v=')[1]?.split('&')[0];
                return videoId ? `https://www.youtube.com/embed/${videoId}?autoplay=1` : null;
            }
            
            if (url.includes('youtu.be/')) {
                const videoId = url.split('youtu.be/')[1]?.split('?')[0];
                return videoId ? `https://www.youtube.com/embed/${videoId}?autoplay=1` : null;
            }
            
            // Twitch
            if (url.includes('twitch.tv/')) {
                const channel = url.split('twitch.tv/')[1]?.split('/')[0];
                return channel ? `https://player.twitch.tv/?channel=${channel}&parent=${location.hostname}` : null;
            }
            
            // For other URLs, try to use them directly
            return url;
        }

        function showError() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'block';
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }

        function toggleMinimize() {
            const container = document.getElementById('pipContainer');
            
            if (!isMinimized) {
                container.classList.add('minimized');
                document.getElementById('controls').style.opacity = '0';
                document.getElementById('launchInfo').style.opacity = '0';
                isMinimized = true;
            } else {
                container.classList.remove('minimized');
                isMinimized = false;
            }
        }

        function openInNewTab() {
            if (streamUrl) {
                window.open(streamUrl, '_blank');
            }
        }

        function showStreamSources() {
            // Implementation of showStreamSources function
        }

        // Make window draggable when minimized
        let isDragging = false;
        let dragOffset = { x: 0, y: 0 };

        document.addEventListener('mousedown', (e) => {
            if (isMinimized && e.target.closest('.pip-container')) {
                isDragging = true;
                const rect = document.getElementById('pipContainer').getBoundingClientRect();
                dragOffset.x = e.clientX - rect.left;
                dragOffset.y = e.clientY - rect.top;
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (isDragging && isMinimized) {
                const container = document.getElementById('pipContainer');
                container.style.position = 'fixed';
                container.style.left = `${e.clientX - dragOffset.x}px`;
                container.style.top = `${e.clientY - dragOffset.y}px`;
            }
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // Auto-minimize on focus loss (optional)
        window.addEventListener('blur', () => {
            if (!isMinimized) {
                setTimeout(() => {
                    if (!document.hasFocus()) {
                        toggleMinimize();
                    }
                }, 1000);
            }
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'f':
                case 'F':
                    toggleFullscreen();
                    break;
                case 'm':
                case 'M':
                    toggleMinimize();
                    break;
                case 'Escape':
                    if (isMinimized) {
                        toggleMinimize();
                    }
                    break;
            }
        });

        // Handle page load without message (fallback)
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const url = urlParams.get('url');
            const name = urlParams.get('name');
            
            if (url) {
                streamUrl = decodeURIComponent(url);
                launchName = decodeURIComponent(name || 'Rocket Launch Stream');
                initializePiP();
            }
        });
    </script>
</body>
</html>
