<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rocketGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="flameGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffa500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff4757;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#rocketGradient)" stroke="white" stroke-width="4"/>
  
  <!-- Rocket body -->
  <ellipse cx="64" cy="45" rx="12" ry="25" fill="white"/>
  
  <!-- Rocket nose cone -->
  <path d="M 52 20 L 64 8 L 76 20 L 64 32 Z" fill="#f8f9fa"/>
  
  <!-- Rocket fins -->
  <path d="M 52 65 L 45 75 L 52 70 Z" fill="#dee2e6"/>
  <path d="M 76 65 L 83 75 L 76 70 Z" fill="#dee2e6"/>
  
  <!-- Rocket window -->
  <circle cx="64" cy="35" r="4" fill="url(#rocketGradient)"/>
  
  <!-- Flame -->
  <path d="M 58 70 L 64 85 L 70 70 L 67 75 L 64 82 L 61 75 Z" fill="url(#flameGradient)"/>
  
  <!-- Stars -->
  <circle cx="25" cy="25" r="2" fill="white" opacity="0.8"/>
  <circle cx="100" cy="35" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="20" cy="90" r="1" fill="white" opacity="0.7"/>
  <circle cx="95" cy="85" r="2" fill="white" opacity="0.5"/>
  <circle cx="110" cy="60" r="1" fill="white" opacity="0.8"/>
</svg> 